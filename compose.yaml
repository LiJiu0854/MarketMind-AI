services:
  redis:
    image: redis:8.2-alpine
    container_name: marketmind-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # exec 让 Redis 接收容器停止信号；$$ 让变量留到容器内展开。
    command: >-
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - redis_data:/data
    healthcheck:
      # CMD-SHELL 会调用 shell 执行命令，用 $$ 传递 REDIS_PASSWORD。
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
